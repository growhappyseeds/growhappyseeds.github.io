<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>relay</title></head>
<body><p id="s">relay</p>
<script>
// Internal helper: hands brand reference images (same-origin files) to the window that opened this page.
(async () => {
  const q = new URLSearchParams(location.search);
  const paths = (q.get('f') || '').split(',').filter(p => /^media\/[\w\-\/.@]+\.(jpg|png|webp)$/.test(p));
  const out = [];
  for (const p of paths) {
    const b = await (await fetch('/' + p)).blob();
    out.push({ name: p.split('/').pop(), type: b.type, buf: await b.arrayBuffer() });
  }
  if (window.opener) window.opener.postMessage({ hsRelay: out }, 'https://chatgpt.com');
  document.getElementById('s').textContent = 'sent ' + out.length;
  setTimeout(() => window.close(), 1500);
})();
</script></body></html>
