# Daily Search Console + GA4 pull for the SEO agents.
# Reads only. Writes tools/seo/data/*.json to main; GitHub Pages does not link to tools/.
# Keyless auth via Workload Identity Federation (pool "github", provider "github-actions" in GCP
# project dynamic-circle-513619-r5, restricted to this repo) as service account seo-data-53, which is
# a Full user on Search Console property sc-domain:growhappyseeds.com and a Viewer on GA4 property 558625133.
name: SEO data pull
on:
  schedule:
    - cron: '20 10 * * *'   # 10:20 UTC = 05:20/06:20 ET, before the 06:54 ET Content Run and the 07:10 ET Analyst
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: seo-data
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861021440004/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: seo-data-53@dynamic-circle-513619-r5.iam.gserviceaccount.com
      - run: pip install -q google-auth requests
      - name: Pull Search Console and GA4
        run: python3 tools/seo/pull_data.py
      - name: Commit data
        run: |
          git config user.name "seo-data-bot"
          git config user.email "seo-data-bot@users.noreply.github.com"
          git add tools/seo/data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "SEO data $(date -u +%F)"
          git push
